# MP124 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G013"          # your group id, e.g. "G042"
problem_id: "MP124"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of block whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "biometric_failures"
    value: 9999            # the special number typed instead of a blank
    count: 44              # how many rows have it
  duplicate_rows:
    present: true
    count: 38              # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "shop_area"
    true_levels: 3         # how many real categories there are after cleaning

tracking:
  experiment_name: "mp124-grain-distribution"
  best_run_id: "2bd07705d10b41b2900b0cd33ba4d31a"  # the MLflow run id of your v1 model
  registered_model_name: "mp124-grain-regressor"
  champion_version: 2

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    cards_attached: null
    working_hours: null
    biometric_failures: null
    temp_c: null
    stock_kg_morning: null
    days_to_month_end: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of block
    'Block North': null
    'Block South': null
    'Block East': null
  worst_served_group: null
  mae_v1_on_check: 167.75681205308504  # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: 120.95644616630872  # v2 on the same rows
  decision: promote                    # promote or keep
